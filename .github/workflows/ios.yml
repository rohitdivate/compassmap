name: iOS

# Tradewind is developed in an environment without Xcode, so this workflow is the
# compiler of record: it builds the app and widget extension for the simulator and runs
# the unit tests.
#
# Note on cost: macOS runner minutes bill at 10x on private repositories. If that is not
# wanted, disable this workflow in the repository's Actions settings — nothing else in
# the project depends on it.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-in-sync:
    name: Generated project is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Tradewind.xcodeproj
        run: python3 Tools/gen_xcodeproj.py
      - name: Fail if the committed project differs
        run: |
          if ! git diff --quiet; then
            echo "::error::Tradewind.xcodeproj is stale. Run: python3 Tools/gen_xcodeproj.py"
            git --no-pager diff --stat
            exit 1
          fi

  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | sed -n '1,40p'

      - name: Pick a simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          data = json.loads(
              subprocess.run(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  capture_output=True, text=True, check=True,
              ).stdout
          )

          def runtime_key(name: str) -> tuple:
              # "com.apple.CoreSimulator.SimRuntime.iOS-18-2" -> (18, 2)
              tail = name.rsplit(".", 1)[-1]
              parts = [p for p in tail.split("-")[1:] if p.isdigit()]
              return tuple(int(p) for p in parts) or (0,)

          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  if "iPhone" not in device["name"]:
                      continue
                  candidates.append((runtime_key(runtime), device["name"], device["udid"]))

          if not candidates:
              sys.exit("no available iPhone simulator on this runner")

          candidates.sort()
          version, name, udid = candidates[-1]
          print(f"udid={udid}")
          print(f"label={name} (iOS {'.'.join(str(v) for v in version)})")
          PY

      - name: Selected simulator
        run: echo "Using ${{ steps.sim.outputs.label }}"

      - name: Build app + widget extension
        run: |
          xcodebuild build \
            -project Tradewind.xcodeproj \
            -scheme Tradewind \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Tradewind.xcodeproj \
            -scheme Tradewind \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
