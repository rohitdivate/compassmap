# XcodeGen spec — the human-readable description of the Xcode project.
#
# `Tradewind.xcodeproj` is committed and generated by `python3 Tools/gen_xcodeproj.py`.
# If that generated project ever misbehaves, regenerate from this spec instead:
#
#     brew install xcodegen && xcodegen generate
#
# Keep the two in sync when adding a target or changing a build setting.

name: Tradewind
options:
  bundleIdPrefix: com.tradewind
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  Tradewind:
    type: application
    platform: iOS
    sources:
      - path: Tradewind
        excludes: ["Info.plist", "Tradewind.entitlements"]
      - path: Shared
      - path: Tradewind/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: TradewindWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradewind.app
        INFOPLIST_FILE: Tradewind/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tradewind/Tradewind.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true

  TradewindWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TradewindWidgets
        excludes: ["Info.plist", "TradewindWidgets.entitlements"]
      - path: Shared
      - path: Tradewind/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradewind.app.widgets
        INFOPLIST_FILE: TradewindWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TradewindWidgets/TradewindWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: true

  # The test bundle compiles the pure layers directly instead of linking the app, so
  # `xcodebuild test` needs no host application.
  TradewindTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TradewindTests
      - path: Shared/Math
      - path: Shared/Snapshot
      - path: Shared/Metadata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradewind.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false

schemes:
  Tradewind:
    build:
      targets:
        Tradewind: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TradewindTests
    archive:
      config: Release
